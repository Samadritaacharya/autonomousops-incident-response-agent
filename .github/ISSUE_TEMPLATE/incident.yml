name: AutonomousOps incident demo
description: Trigger the event-driven incident orchestration workflow.
title: "[INCIDENT] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This issue triggers the public AutonomousOps workflow. Use synthetic/demo information only.
  - type: input
    id: service
    attributes:
      label: Service
      placeholder: checkout-api
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - production
        - staging
        - development
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      placeholder: Requests are timing out after a deployment.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Customer impact
      placeholder: Multiple customers cannot complete checkout.
    validations:
      required: true
  - type: dropdown
    id: recent_change
    attributes:
      label: Recent change or deployment?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

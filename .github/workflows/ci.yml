name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall src scripts app.py api.py
      - name: Unit and governance tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: python scripts/simulate_incident.py > /tmp/autonomousops-demo.json
      - name: Streamlit smoke test
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - name: FastAPI smoke test
        run: |
          uvicorn api:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - name: Docker build smoke test
        run: docker build -t autonomousops:test .

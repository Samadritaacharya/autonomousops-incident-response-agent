name: Command Center CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Agent and validation contract tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Boot and smoke test web/API
        shell: bash
        run: |
          set -euo pipefail
          npm start -- -p 3000 > /tmp/autonomousops-web.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT

          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/ > /tmp/home.html
          curl -fsS http://127.0.0.1:3000/api/evaluation > /tmp/evaluation.json

          BASE='{"incident_id":"CI-1","title":"Checkout API timeouts","description":"Production checkout requests are timing out for multiple users after a deployment","service":"checkout-api","environment":"production","customer_impact":"Multiple customers cannot complete checkout","recent_change":true}'

          curl -fsS -X POST http://127.0.0.1:3000/api/incidents \
            -H 'Content-Type: application/json' \
            -d "$BASE" > /tmp/waiting.json

          curl -fsS -X POST 'http://127.0.0.1:3000/api/incidents?approved=true' \
            -H 'Content-Type: application/json' \
            -d "$BASE" > /tmp/approved.json

          curl -fsS -X POST http://127.0.0.1:3000/api/incidents \
            -H 'Content-Type: application/json' \
            -d '{"incident":{"incident_id":"CI-1","title":"Checkout API timeouts","description":"Production checkout requests are timing out for multiple users after a deployment","service":"checkout-api","environment":"production","customer_impact":"Multiple customers cannot complete checkout","recent_change":true},"decision":"reject"}' > /tmp/rejected.json

          curl -fsS -X POST http://127.0.0.1:3000/api/incidents \
            -H 'Content-Type: application/json' \
            -d '{"incident_id":"CI-GENERIC","title":"Scheduled task notice","description":"A background task needs inspection.","service":"unknown-service","environment":"development","customer_impact":"No customer impact","recent_change":false}' > /tmp/generic.json

          INVALID_JSON_CODE=$(curl -sS -o /tmp/invalid-json.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/incidents \
            -H 'Content-Type: application/json' -d '{')
          PRIMITIVE_CODE=$(curl -sS -o /tmp/primitive.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/incidents \
            -H 'Content-Type: application/json' -d 'null')
          BLANK_CODE=$(curl -sS -o /tmp/blank.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/incidents \
            -H 'Content-Type: application/json' \
            -d '{"incident_id":"CI-BLANK","title":"   ","description":"Something happened","service":"checkout-api","environment":"production","customer_impact":"Users affected","recent_change":false}')
          CONFLICT_CODE=$(curl -sS -o /tmp/conflict.json -w '%{http_code}' -X POST 'http://127.0.0.1:3000/api/incidents?approved=true' \
            -H 'Content-Type: application/json' \
            -d '{"incident":{"incident_id":"CI-CONFLICT","title":"Checkout API timeouts","description":"Production checkout requests are timing out","service":"checkout-api","environment":"production","customer_impact":"Multiple users affected","recent_change":true},"decision":"reject"}')

          node - <<'NODE'
          const fs = require('fs')
          fs.writeFileSync('/tmp/large.json', JSON.stringify({
            incident_id: 'CI-LARGE',
            title: 'Large request',
            description: 'x'.repeat(33000),
            service: 'checkout-api',
            environment: 'production',
            customer_impact: 'Users affected',
            recent_change: false,
          }))
          NODE
          LARGE_CODE=$(curl -sS -o /tmp/large-response.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/incidents \
            -H 'Content-Type: application/json' --data-binary @/tmp/large.json)

          export INVALID_JSON_CODE PRIMITIVE_CODE BLANK_CODE CONFLICT_CODE LARGE_CODE
          node - <<'NODE'
          const fs = require('fs')
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'))
          const evaluation = JSON.parse(fs.readFileSync('/tmp/evaluation.json', 'utf8'))
          const waiting = JSON.parse(fs.readFileSync('/tmp/waiting.json', 'utf8'))
          const approved = JSON.parse(fs.readFileSync('/tmp/approved.json', 'utf8'))
          const rejected = JSON.parse(fs.readFileSync('/tmp/rejected.json', 'utf8'))
          const generic = JSON.parse(fs.readFileSync('/tmp/generic.json', 'utf8'))

          if (health.status !== 'ok' || health.paid_api_required !== false) throw new Error('health contract failed')
          if (evaluation.cases !== 24 || evaluation.severity_accuracy !== 1 || evaluation.runbook_accuracy !== 1 || evaluation.approval_gate_accuracy !== 1) throw new Error('evaluation contract failed')
          if (waiting.severity !== 'P1' || waiting.status !== 'WAITING_FOR_APPROVAL' || !waiting.approval_id) throw new Error('waiting path failed')
          if (approved.status !== 'ACTION_EXECUTED' || approved.tool_executions.at(-1)?.status !== 'SUCCEEDED') throw new Error('approval resume failed')
          if (rejected.status !== 'ACTION_BLOCKED' || rejected.tool_executions.at(-1)?.tool !== 'human approval') throw new Error('rejection path failed')
          if (generic.status !== 'ACTION_EXECUTED' || generic.runbook !== 'generic-incident.md') throw new Error('generic fallback failed')
          if (process.env.INVALID_JSON_CODE !== '400') throw new Error(`invalid JSON expected 400, got ${process.env.INVALID_JSON_CODE}`)
          if (process.env.PRIMITIVE_CODE !== '400') throw new Error(`primitive JSON expected 400, got ${process.env.PRIMITIVE_CODE}`)
          if (process.env.BLANK_CODE !== '422') throw new Error(`blank incident expected 422, got ${process.env.BLANK_CODE}`)
          if (process.env.CONFLICT_CODE !== '400') throw new Error(`decision conflict expected 400, got ${process.env.CONFLICT_CODE}`)
          if (process.env.LARGE_CODE !== '413') throw new Error(`large request expected 413, got ${process.env.LARGE_CODE}`)
          if (!fs.readFileSync('/tmp/home.html', 'utf8').includes('AutonomousOps')) throw new Error('home page did not render')
          console.log('web, evaluation, approval, rejection, validation and size-limit smoke tests passed')
          NODE
